name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci
      - run: npm --prefix packages/contracts ci && npm --prefix apps/server ci && npm --prefix infra ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth -q
        working-directory: infra
        env: { CDK_DEFAULT_ACCOUNT: "000000000000" }
